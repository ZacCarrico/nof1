name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      # --continue reports every failing task, not just the first.
      - name: Build, test and lint
        run: ./gradlew build --continue

      # The build exports the database schema; a changed or new schema file must be committed.
      - name: Check that the database schema is committed
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain -- core/database/schemas)" ]; then
            echo "::error::The database schema changed. Commit core/database/schemas:"
            git status --porcelain -- core/database/schemas
            git add -N core/database/schemas
            git diff -- core/database/schemas
            exit 1
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Lets the emulator use hardware virtualization.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's system image has its own license, which the runner's SDK hasn't accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Gradle creates, starts and stops the emulator defined in build-logic.
      - name: Run instrumented tests
        run: >-
          ./gradlew --continue
          :core:database:pixel6Api30DebugAndroidTest
          :core:data:pixel6Api30DebugAndroidTest
          :app:pixel6Api30DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # Gradle's output only links to the report, so print each failed test's message.
      - name: Show failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          pattern = "**/build/outputs/androidTest-results/**/*.xml"
          for path in glob.glob(pattern, recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case:
                      if problem.tag in ("failure", "error"):
                          print(f"FAILED {case.get('classname')}.{case.get('name')}")
                          print((problem.text or problem.get("message") or "").strip()[:3000])
          EOF

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: '**/build/reports/'
